name: 3T Biosciences
description: >-
  3T Biosciences is a clinical-stage immunotherapy company based in South San
  Francisco, developing next-generation T-cell receptor (TCR) therapeutics for
  solid tumors and other immune-mediated diseases. Founded in 2017 on research
  from K. Christopher Garcia's lab at Stanford University, the company operates
  its proprietary 3T-TRACE (T-Cell Receptor Antigen and Cross-reactivity
  Evaluation) platform, which combines high-diversity yeast-display target
  libraries with active machine-learning to screen billions of protein
  fragments and identify novel shared TCR targets and specificities. 3T has
  raised a $40M Series A from Westlake Village BioPartners and Lightspeed
  Venture Partners and has struck cancer-immunotherapy collaborations with
  Boehringer Ingelheim worth up to $268M in milestones. This profile was
  surfaced as a portfolio company of CRV and enriched into the API Evangelist
  network; 3T publishes no public developer API, SDK, or specification surface.
